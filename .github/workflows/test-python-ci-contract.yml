name: Test Python CI contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - run: bash tests/test-python-ci-contract.sh
      - run: bash tests/test-private-git-auth.sh
      - run: bash tests/test-metric-cardinality.sh
      - run: bash tests/test-action-pins.sh
      - run: bash tests/test-s3-request-audit.sh
      # Proves the suites above fail when the guards they cover stop working.
      - run: bash tests/test-mutations.sh
      # Runs them again on a squash-merged checkout, where three defects have hidden before.
      - run: bash tests/test-post-merge.sh
